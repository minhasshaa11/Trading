<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bond 1X - Investment Platform</title>
    
    <script src="/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #C5A059;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .skeleton {
            background-color: rgba(92,74,61,0.1); border-radius: 0.25rem;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse { 50% { opacity: .4; } }
        
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="font-sans antialiased" style="background-color: #FDFBF7; color: #5C4A3D; padding-bottom: 100px; overflow-x: hidden;">

<div id="auth-status-overlay" class="fixed inset-0 flex-col items-center justify-center text-center z-[2000] px-4" style="background-color: #FDFBF7; display: flex;">
    <div id="loading-spinner" class="spinner"></div>
    <h1 id="auth-status-title" class="text-2xl font-serif font-bold text-[#332415] mb-2">Authenticating</h1>
    <p id="auth-status-message" class="text-gray-500 text-sm">Securing your connection...</p>
    <button id="retry-btn" class="mt-5 px-8 py-3 bg-[#332415] text-white border-none rounded-xl font-semibold text-sm shadow-lg" style="display:none;" onclick="retryAuth()">Retry Connection</button>
</div>

<div id="dashboard-content" class="max-w-md mx-auto p-5 pt-8 relative z-10" style="display: none;">
    
    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-2xl tracking-widest font-serif font-bold text-[#332415]">BOND <span class="text-[#C5A059]">1X</span></h1>
            <p class="text-sm text-gray-500 mt-1">Welcome, <span id="username-display" class="font-semibold text-[#5C4A3D]">...</span></p>
        </div>
        <div class="bg-[#C5A059] text-white font-bold text-sm w-11 h-11 rounded-full flex items-center justify-center shadow-md border-2 border-white">
            MS
        </div>
    </header>

    <main class="space-y-6">
        <div class="bg-[#332415] text-white rounded-3xl p-7 shadow-2xl relative overflow-hidden">
            <div class="relative z-10">
                <p class="text-xs tracking-widest text-[#C5A059] mb-2 uppercase opacity-90 font-semibold">Total Balance</p>
                <h2 id="balance-display" class="text-5xl font-serif text-[#C5A059] mb-4 hidden">$0.00</h2>
                <div id="balance-skeleton" class="skeleton h-12 w-40 mb-4"></div>
                
                <div class="flex justify-between items-end mt-6">
                    <div>
                        <p class="text-[10px] text-gray-400 uppercase tracking-wide mb-1">Status</p>
                        <span id="package-display" class="bg-[#C5A059]/20 text-[#C5A059] text-xs px-3 py-1.5 rounded-lg border border-[#C5A059]/30 hidden">None</span>
                        <div id="package-skeleton" class="skeleton h-6 w-20"></div>
                    </div>
                </div>
            </div>
            <div class="absolute -right-12 -top-12 w-48 h-48 bg-white opacity-5 rounded-full blur-3xl"></div>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <a href="wallet.html" class="bg-white border border-gray-100 rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm text-[#5C4A3D] hover:border-[#C5A059] transition-colors">
                <svg class="w-6 h-6 mb-2 text-[#C5A059]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span class="text-[10px] font-bold tracking-widest uppercase">Deposit</span>
            </a>
            <a href="wallet.html" class="bg-white border border-gray-100 rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm text-[#5C4A3D] hover:border-[#C5A059] transition-colors">
                <svg class="w-6 h-6 mb-2 text-[#C5A059]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span class="text-[10px] font-bold tracking-widest uppercase">Withdraw</span>
            </a>
            <a href="packages.html" class="bg-white border border-gray-100 rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm text-[#5C4A3D] hover:border-[#C5A059] transition-colors">
                <svg class="w-6 h-6 mb-2 text-[#C5A059]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                <span class="text-[10px] font-bold tracking-widest uppercase">Packages</span>
            </a>
        </div>

        <div id="dynamic-action-section" class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 text-center mt-2">
            <div class="skeleton h-6 w-3/4 mx-auto mb-4"></div>
            <div class="skeleton h-10 w-full rounded-xl"></div>
        </div>
    </main>
</div>

<nav class="fixed bottom-0 left-0 w-full border-t border-gray-200 z-[1000] flex justify-around py-3" style="background-color: #FDFBF7;">
    <a href="dashboard.html" class="flex flex-col items-center justify-center gap-1 text-[#C5A059]" style="text-decoration: none;">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-[10px] font-bold tracking-widest">HOME</span>
    </a>
    <a href="packages.html" class="flex flex-col items-center justify-center gap-1 text-[#A09E9C]" style="text-decoration: none;">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span class="text-[10px] font-bold tracking-widest">PLANS</span>
    </a>
    <a href="earning.html" class="flex flex-col items-center justify-center gap-1 text-[#A09E9C]" style="text-decoration: none;">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <span class="text-[10px] font-bold tracking-widest">EARN</span>
    </a>
    <a href="wallet.html" class="flex flex-col items-center justify-center gap-1 text-[#A09E9C]" style="text-decoration: none;">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H4a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        <span class="text-[10px] font-bold tracking-widest">WALLET</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center justify-center gap-1 text-[#A09E9C]" style="text-decoration: none;">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px] font-bold tracking-widest">PROFILE</span>
    </a>
</nav>

<script>
    const authOverlay  = document.getElementById('auth-status-overlay');
    const authTitle    = document.getElementById('auth-status-title');
    const authMessage  = document.getElementById('auth-status-message');
    const spinner      = document.getElementById('loading-spinner');
    const retryBtn     = document.getElementById('retry-btn');

    function showError(title, message, detail) {
        authTitle.textContent   = title;
        authMessage.textContent = message;
        spinner.style.display   = 'none';
        retryBtn.style.display  = 'inline-block';
        authOverlay.style.display = 'flex';
    }

    function showLoading(msg) {
        authTitle.textContent   = 'Authenticating';
        authMessage.textContent = msg || 'Please wait...';
        spinner.style.display   = 'block';
        retryBtn.style.display  = 'none';
        authOverlay.style.display = 'flex';
    }

    function hideOverlay() {
        authOverlay.style.display = 'none';
    }

    function initializeDashboard(token, initialUserData) {
        document.getElementById('dashboard-content').style.display = 'block';

        var socket          = io({ auth: { token: token } });
        var usernameDisplay = document.getElementById('username-display');
        var balanceDisplay  = document.getElementById('balance-display');
        var packageDisplay  = document.getElementById('package-display');
        var balanceSkeleton = document.getElementById('balance-skeleton');
        var packageSkeleton = document.getElementById('package-skeleton');
        var dynamicSection  = document.getElementById('dynamic-action-section');

        function renderData(data) {
            usernameDisplay.textContent = data.username || 'User';
            balanceDisplay.textContent  = '$' + (data.balance || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            packageDisplay.textContent  = data.activePackage || 'None';
            balanceSkeleton.style.display = 'none';
            packageSkeleton.style.display = 'none';
            balanceDisplay.style.display  = 'block';
            packageDisplay.style.display  = 'block';

            if (data.activePackage) {
                var expiry = new Date(data.packageExpiry).toLocaleDateString();
                dynamicSection.innerHTML = '<div class="flex items-center justify-between mb-4"><h3 class="font-serif text-lg font-bold text-[#332415]">Active Task Ready</h3><span class="text-xs px-2 py-1 bg-green-50 text-green-600 rounded border border-green-100">Live</span></div><div class="flex justify-between text-sm mb-6"><span class="text-gray-500">Contract Expiry</span><span class="font-semibold text-[#332415]">' + expiry + '</span></div><a href="earning.html" class="block w-full py-3 rounded-xl font-bold text-white bg-[#332415] border border-[#332415] shadow-md transition-colors text-center">Claim Daily Profit</a>';
            } else {
                dynamicSection.innerHTML = '<div class="py-2"><h3 class="font-serif text-xl font-bold text-[#332415] mb-2">Start Earning Today</h3><p class="text-gray-500 text-sm mb-6 px-4">You don\'t have an active investment package. Purchase one to start earning daily.</p><a href="packages.html" class="block w-full py-3 rounded-xl font-bold text-[#332415] bg-white border-2 border-[#332415] shadow-sm transition-colors text-center">View Packages</a></div>';
            }
        }

        if (initialUserData) renderData(initialUserData);

        socket.on('connect', function() { socket.emit('request_dashboard_data'); });
        socket.on('dashboard_data', function(res) { if (res && res.success) renderData(res.data); });
        socket.on('connect_error', function(err) { console.error('Socket error:', err.message); });
    }

    function performFullAuthentication() {
        showLoading('Please wait while we log you in securely.');
        var attempts = 0;

        function checkTelegram() {
            attempts++;
            if (window.Telegram && window.Telegram.WebApp) {
                var tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                var initData = tg.initData;
                if (initData) {
                    doLogin(initData);
                } else if (attempts < 150) {
                    setTimeout(checkTelegram, 100);
                } else {
                    showError('Initialization Failed', 'Could not get Telegram data. Please close and reopen the app.', '');
                }
            } else if (attempts < 150) {
                setTimeout(checkTelegram, 100);
            } else {
                showError('Initialization Failed', 'Could not connect to Telegram. Please close the app and reopen.', '');
            }
        }
        checkTelegram();
    }

    function doLogin(initData) {
        showLoading('Verifying your account...');
        fetch('/api/auth/telegram-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: initData })
        })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, status: r.status, data: d }; }); })
        .then(function(result) {
            if (!result.ok) {
                showError('Login Failed', result.data.message || 'Server error.', 'Status: ' + result.status);
                return;
            }
            localStorage.setItem('authToken', result.data.token);
            hideOverlay();
            initializeDashboard(result.data.token, result.data.user);
        })
        .catch(function(err) {
            showError('Connection Error', 'Could not reach the server.', err.message);
        });
    }

    function retryAuth() {
        localStorage.removeItem('authToken');
        performFullAuthentication();
    }

    function startApp() {
        var token = localStorage.getItem('authToken');
        if (token) {
            hideOverlay();
            initializeDashboard(token);
        } else {
            performFullAuthentication();
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startApp);
    } else {
        startApp();
    }
</script>

</body>
</html>
