<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Packages - Bond 1x</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--cream:#FBF8F3;--cream-dark:#F2EDE4;--cream-border:#E8DFD0;--brown-dark:#2D1F0E;--brown-mid:#4A3020;--brown-light:#8B6040;--gold:#C9832A;--gold-light:#E8A84A;--gold-pale:#F5E8D0;--green:#3D7A52;--text-main:#1E140A;--text-muted:#9A8070;--white:#FFFFFF;}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-main);min-height:100vh;padding-bottom:90px;overflow-x:hidden;}

        /* Header */
        .hdr{background:var(--brown-dark);padding:20px 20px 0;position:relative;overflow:hidden;}
        .hdr::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,131,42,.15),transparent 70%);}
        .hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
        .hdr-logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--gold);letter-spacing:3px;}
        .hdr-bal{text-align:right;}
        .hdr-bal-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#6B5030;}
        .hdr-bal-val{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--gold-light);}
        .hero{background:var(--brown-mid);border-radius:18px 18px 0 0;padding:20px;border:1px solid rgba(201,131,42,.15);border-bottom:none;position:relative;overflow:hidden;}
        .hero::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
        .hero-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-style:italic;color:var(--gold-light);margin-bottom:4px;}
        .hero-sub{font-size:13px;color:#6B5030;}

        /* Body */
        .bdy{padding:16px;}
        .sec-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;margin-top:4px;}

        /* Package Cards */
        .pkg-grid{display:flex;flex-direction:column;gap:14px;}
        .pkg-card{background:var(--white);border:1px solid var(--cream-border);border-radius:16px;padding:20px;border-left:4px solid var(--gold);box-shadow:0 4px 20px rgba(45,31,14,.06);animation:fu .4s ease both;transition:transform .2s;}
        .pkg-card:nth-child(2){animation-delay:.06s;}
        .pkg-card:nth-child(3){animation-delay:.12s;}
        .pkg-card:nth-child(4){animation-delay:.18s;}
        .pkg-card:nth-child(5){animation-delay:.24s;}
        .pkg-card:active{transform:scale(.98);}
        .pkg-card.dimmed{opacity:.5;}
        @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

        .pkg-card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
        .pkg-card-nm{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:var(--text-main);}
        .pkg-card-price{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--gold);}
        .pkg-card-price sup{font-size:14px;vertical-align:top;margin-top:4px;display:inline-block;}

        .pkg-card-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;}
        .pkg-card-k{color:var(--text-muted);}
        .pkg-card-v{color:var(--text-main);font-weight:500;}

        .pkg-card-btn{width:100%;border:none;border-radius:12px;padding:14px;font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:1px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:14px;display:block;text-align:center;}
        .pkg-card-btn:active{transform:scale(.97);}
        .pkg-card-btn.primary{background:var(--gold);color:var(--brown-dark);}
        .pkg-card-btn.primary:active{background:var(--gold-light);}
        .pkg-card-btn.active-plan{background:var(--green);color:var(--white);cursor:default;}
        .pkg-card-btn.disabled{background:var(--cream-dark);color:var(--text-muted);cursor:not-allowed;}

        .pkg-card-badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:20px;font-weight:500;}
        .badge-active{background:rgba(61,122,82,.12);border:1px solid rgba(61,122,82,.3);color:var(--green);}
        .badge-popular{background:rgba(201,131,42,.12);border:1px solid rgba(201,131,42,.3);color:var(--gold);}

        /* Status */
        .status-msg{text-align:center;margin-top:16px;min-height:24px;font-size:13px;font-weight:500;}
        .status-msg.error{color:#C0392B;}
        .status-msg.success{color:var(--green);}

        /* Modal */
        .modal-ov{position:fixed;inset:0;background:rgba(45,31,14,.6);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(4px);}
        .modal-box{background:var(--white);border:1px solid var(--cream-border);border-radius:20px;padding:28px;text-align:center;width:calc(100% - 48px);max-width:340px;box-shadow:0 12px 40px rgba(45,31,14,.15);}
        .modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;margin-bottom:10px;}
        .modal-text{font-size:13px;color:var(--text-muted);margin-bottom:22px;line-height:1.5;}
        .modal-btns{display:flex;gap:10px;}
        .modal-btn{flex:1;padding:13px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
        .modal-btn:active{transform:scale(.96);}
        .modal-btn-cancel{background:var(--cream-dark);color:var(--text-main);}
        .modal-btn-confirm{background:var(--gold);color:var(--brown-dark);}

        /* Nav */
        .nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;background:var(--brown-dark);border-radius:22px;padding:12px 8px;display:flex;justify-content:space-around;z-index:1000;box-shadow:0 8px 32px rgba(45,31,14,.25);border:1px solid rgba(201,131,42,.15);}
        .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;transition:all .2s;}
        .ni svg{color:#3A2A18;transition:color .2s;}
        .ni span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#3A2A18;transition:color .2s;font-weight:500;}
        .ni.active svg,.ni.active span{color:var(--gold);}
        .nd{width:3px;height:3px;border-radius:50%;background:var(--gold);margin-top:1px;display:none;}
        .ni.active .nd{display:block;}

        /* Skeleton */
        .skel{background:linear-gradient(90deg,var(--cream-dark) 25%,var(--cream-border) 50%,var(--cream-dark) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:6px;display:block;}
        @keyframes sh{to{background-position:-200% 0}}
    </style>
</head>
<body>
<script>
    if (!localStorage.getItem('authToken')) window.location.href = '/login.html';
</script>

<div class="hdr">
    <div class="hdr-top">
        <div class="hdr-logo">Bond 1x</div>
        <div class="hdr-bal">
            <div class="hdr-bal-lbl">Balance</div>
            <div class="hdr-bal-val" id="balance-display"><span class="skel" style="width:80px;height:22px;border-radius:4px;"></span></div>
        </div>
    </div>
    <div class="hero">
        <div class="hero-title">Investment Packages</div>
        <div class="hero-sub">Select a package to start earning</div>
    </div>
</div>

<div class="bdy">
    <div class="sec-lbl">Available Plans</div>
    <div class="pkg-grid" id="packages-container">
        <!-- Skeleton cards -->
        <div class="pkg-card"><div class="pkg-card-hd"><span class="skel" style="width:100px;height:24px;"></span><span class="skel" style="width:70px;height:28px;"></span></div><span class="skel" style="width:100%;height:13px;margin-bottom:8px;"></span><span class="skel" style="width:80%;height:13px;margin-bottom:14px;"></span><span class="skel" style="width:100%;height:48px;border-radius:12px;"></span></div>
        <div class="pkg-card"><div class="pkg-card-hd"><span class="skel" style="width:100px;height:24px;"></span><span class="skel" style="width:70px;height:28px;"></span></div><span class="skel" style="width:100%;height:13px;margin-bottom:8px;"></span><span class="skel" style="width:80%;height:13px;margin-bottom:14px;"></span><span class="skel" style="width:100%;height:48px;border-radius:12px;"></span></div>
    </div>
    <div class="status-msg" id="status-message"></div>
</div>

<!-- Confirm Modal -->
<div id="custom-confirm-modal" class="modal-ov">
    <div class="modal-box">
        <div class="modal-title" id="modal-title">Confirm Purchase</div>
        <div class="modal-text" id="modal-text">Are you sure?</div>
        <div class="modal-btns">
            <button class="modal-btn modal-btn-cancel" id="modal-cancel-btn">Cancel</button>
            <button class="modal-btn modal-btn-confirm" id="modal-confirm-btn">Confirm</button>
        </div>
    </div>
</div>

<nav class="nav">
    <a href="dashboard.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg><span>Home</span><div class="nd"></div></a>
    <a href="packages.html" class="ni active"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>Packages</span><div class="nd"></div></a>
    <a href="earning.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg><span>Earn</span><div class="nd"></div></a>
    <a href="wallet.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2z"/></svg><span>Wallet</span><div class="nd"></div></a>
    <a href="profile.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0114 0"/></svg><span>Profile</span><div class="nd"></div></a>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var token = localStorage.getItem('authToken');
    var headers = {'Content-Type':'application/json','x-auth-token':token};
    var balanceDisplay = document.getElementById('balance-display');
    var packagesContainer = document.getElementById('packages-container');
    var statusMessage = document.getElementById('status-message');
    var modal = document.getElementById('custom-confirm-modal');
    var modalTitle = document.getElementById('modal-title');
    var modalText = document.getElementById('modal-text');
    var modalConfirmBtn = document.getElementById('modal-confirm-btn');
    var modalCancelBtn = document.getElementById('modal-cancel-btn');

    var activeUserPackage = null;
    var userBalance = 0;

    var packages = {
        "Bronze":   {price:30,   dailyProfit:1,   durationDays:90},
        "Silver":   {price:100,  dailyProfit:4,   durationDays:90},
        "Gold":     {price:200,  dailyProfit:9,   durationDays:90},
        "Platinum": {price:500,  dailyProfit:23,  durationDays:90},
        "Diamond":  {price:1000, dailyProfit:50,  durationDays:90}
    };

    function showCustomConfirm(packageName, onConfirm) {
        modalTitle.textContent = 'Confirm Purchase';
        modalText.textContent = 'Are you sure you want to purchase the ' + packageName + ' Plan?';
        modal.style.display = 'flex';
        function confirmHandler(){onConfirm();cleanup();}
        function cancelHandler(){cleanup();}
        function cleanup(){
            modal.style.display='none';
            modalConfirmBtn.removeEventListener('click',confirmHandler);
            modalCancelBtn.removeEventListener('click',cancelHandler);
        }
        modalConfirmBtn.addEventListener('click',confirmHandler);
        modalCancelBtn.addEventListener('click',cancelHandler);
    }

    function showStatus(message, isError) {
        statusMessage.textContent = message;
        statusMessage.className = 'status-msg ' + (isError ? 'error' : 'success');
    }

    function fetchUserStatus() {
        fetch('/api/user/info',{headers:headers})
        .then(function(r){return r.json();})
        .then(function(result){
            if(result.success){
                userBalance = result.user.balance;
                balanceDisplay.innerHTML = '<sup>$</sup>' + userBalance.toFixed(2);
                activeUserPackage = result.user.active_package;
                renderPackages();
            } else { throw new Error(result.message); }
        })
        .catch(function(){
            showStatus('Could not load user data. Please try again.', true);
        });
    }

    function purchasePackage(packageName) {
        showCustomConfirm(packageName, function(){
            showStatus('Processing your purchase...', false);
            fetch('/api/user/purchase-package',{
                method:'POST',
                headers:headers,
                body:JSON.stringify({packageName:packageName})
            })
            .then(function(r){return r.json();})
            .then(function(result){
                if(result.success){
                    showStatus(result.message, false);
                    confetti({particleCount:150,spread:90,origin:{y:0.6},colors:['#C9832A','#E8A84A','#3D7A52']});
                    fetchUserStatus();
                } else {
                    showStatus(result.message, true);
                }
            })
            .catch(function(){
                showStatus('An error occurred. Please try again.', true);
            });
        });
    }

    function renderPackages() {
        packagesContainer.innerHTML = '';
        var names = Object.keys(packages);
        for(var i=0; i<names.length; i++){
            var name = names[i];
            var details = packages[name];
            var isAffordable = userBalance >= details.price;
            var isCurrentPlan = activeUserPackage === name;
            var canInteract = !isCurrentPlan && isAffordable;

            var card = document.createElement('div');
            card.className = 'pkg-card' + (!isAffordable && !isCurrentPlan ? ' dimmed' : '');

            var badgeHtml = '';
            if(isCurrentPlan) badgeHtml = '<span class="pkg-card-badge badge-active">Active</span>';
            else if(name === 'Gold') badgeHtml = '<span class="pkg-card-badge badge-popular">Popular</span>';

            var btnHtml = '';
            if(isCurrentPlan){
                btnHtml = '<button class="pkg-card-btn active-plan" disabled>Plan Activated</button>';
            } else if(!isAffordable){
                btnHtml = '<button class="pkg-card-btn disabled" disabled>Insufficient Balance</button>';
            } else {
                btnHtml = '<button class="pkg-card-btn primary purchase-btn">Activate Plan</button>';
            }

            card.innerHTML = '<div class="pkg-card-hd"><span class="pkg-card-nm">' + name + ' Plan</span>' + badgeHtml + '</div>' +
                '<div class="pkg-card-hd" style="margin-bottom:14px;"><span class="pkg-card-price"><sup>$</sup>' + details.price.toLocaleString() + '</span></div>' +
                '<div class="pkg-card-row"><span class="pkg-card-k">Daily Profit</span><span class="pkg-card-v">$' + details.dailyProfit.toLocaleString() + '</span></div>' +
                '<div class="pkg-card-row"><span class="pkg-card-k">Duration</span><span class="pkg-card-v">' + details.durationDays + ' Days</span></div>' +
                '<div class="pkg-card-row"><span class="pkg-card-k">Total Return</span><span class="pkg-card-v">$' + (details.dailyProfit * details.durationDays).toLocaleString() + '</span></div>' +
                btnHtml;

            if(canInteract){
                (function(n){
                    card.querySelector('.purchase-btn').addEventListener('click', function(){purchasePackage(n);});
                })(name);
            }
            packagesContainer.appendChild(card);
        }
    }

    fetchUserStatus();
});
</script>
</body>
</html>
