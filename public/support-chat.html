<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Support Chat - Bond 1x</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--cream:#FBF8F3;--cream-dark:#F2EDE4;--cream-border:#E8DFD0;--brown-dark:#2D1F0E;--brown-mid:#4A3020;--brown-light:#8B6040;--gold:#C9832A;--gold-light:#E8A84A;--gold-pale:#F5E8D0;--green:#3D7A52;--text-main:#1E140A;--text-muted:#9A8070;--white:#FFFFFF;}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-main);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
        .hdr{background:var(--brown-dark);padding:16px 20px 0;position:relative;overflow:hidden;flex-shrink:0;}
        .hdr::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,131,42,.15),transparent 70%);}
        .hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
        .hdr-logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--gold);letter-spacing:3px;}
        .hdr-back{font-size:13px;color:#D4B896;text-decoration:none;font-weight:500;transition:color .2s;padding:8px 14px;background:rgba(201,131,42,.15);border-radius:10px;display:flex;align-items:center;gap:6px;}
        .hdr-back:active{color:var(--gold-light);background:rgba(201,131,42,.25);}
        .hero{background:var(--brown-mid);border-radius:18px 18px 0 0;padding:16px 20px;border:1px solid rgba(201,131,42,.15);border-bottom:none;position:relative;overflow:hidden;}
        .hero::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
        .hero-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:var(--gold-light);margin-bottom:2px;}
        .hero-sub{font-size:12px;color:#D4B896;}
        .hero-online{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:4px;vertical-align:middle;}
        .chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
        .chat-card{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--white);margin:0 12px;border:1px solid var(--cream-border);border-radius:0 0 16px 16px;border-top:none;}
        .chat-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:16px;gap:4px;}
        .message{max-width:78%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5;word-wrap:break-word;animation:fu .3s ease both;position:relative;}
        @keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .user-message{align-self:flex-end;background:var(--gold);color:var(--brown-dark);border-bottom-right-radius:4px;margin-left:20%;}
        .admin-message{align-self:flex-start;background:var(--cream-dark);color:var(--text-main);border:1px solid var(--cream-border);border-bottom-left-radius:4px;margin-right:20%;}
        .msg-content{margin-bottom:2px;}
        .msg-time{display:block;font-size:9px;text-align:right;opacity:.6;margin-top:2px;}
        .user-message .msg-time{color:var(--brown-mid);}
        .admin-message .msg-time{color:var(--text-muted);}
        .msg-sender{font-size:10px;font-weight:600;margin-bottom:2px;color:var(--green);}
        .chat-status{text-align:center;color:var(--text-muted);padding:16px 0;font-size:13px;}
        .welcome-msg{text-align:center;padding:20px;color:var(--text-muted);font-size:12px;line-height:1.6;}
        .welcome-msg-icon{width:48px;height:48px;border-radius:14px;background:var(--gold-pale);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;}
        .date-sep{text-align:center;font-size:10px;color:var(--text-muted);padding:8px 0;position:relative;}
        .date-sep span{background:var(--white);padding:0 10px;position:relative;z-index:1;}
        .date-sep::before{content:'';position:absolute;left:20%;right:20%;top:50%;height:1px;background:var(--cream-border);}
        .msg-failed{opacity:0.5;border:1px dashed var(--gold);}
        .msg-retry{font-size:10px;color:#C0392B;margin-top:4px;cursor:pointer;text-decoration:underline;}
        .chat-input-bar{padding:10px 12px;background:var(--white);border-top:1px solid var(--cream-border);flex-shrink:0;}
        .chat-input-inner{display:flex;gap:8px;max-width:600px;margin:0 auto;}
        .chat-input{flex:1;background:var(--cream-dark);border:1px solid var(--cream-border);border-radius:20px;padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text-main);outline:none;transition:border-color .2s;max-height:80px;}
        .chat-input:focus{border-color:var(--gold);}
        .chat-input::placeholder{color:var(--text-muted);}
        .chat-send-btn{background:var(--gold);border:none;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;}
        .chat-send-btn:active{background:var(--gold-light);transform:scale(.92);}
        .chat-send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
        .char-count{font-size:9px;color:var(--text-muted);text-align:right;margin-top:2px;padding-right:54px;}
        .char-count.warn{color:#C0392B;}
    </style>
</head>
<body>

<div class="hdr">
    <div class="hdr-top">
        <div class="hdr-logo">Bond 1x</div>
        <a href="/profile.html" class="hdr-back">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back
        </a>
    </div>
    <div class="hero">
        <div class="hero-title">Customer Support</div>
        <div class="hero-sub"><span class="hero-online"></span>We're here to help you</div>
    </div>
</div>

<div class="chat-wrap">
    <div class="chat-card">
        <div id="chat-container" class="chat-container">
            <p id="chat-status" class="chat-status">Loading chat history...</p>
        </div>
    </div>
</div>

<div class="chat-input-bar">
    <div class="chat-input-inner">
        <input type="text" id="message-input" class="chat-input" placeholder="Type your message..." maxlength="2000">
        <button id="send-btn" class="chat-send-btn" disabled>
            <svg width="18" height="18" fill="none" stroke="var(--brown-dark)" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
    </div>
    <div id="char-count" class="char-count" style="display:none;">0 / 2000</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    if (!localStorage.getItem('authToken')) {
        window.location.href = '/login.html';
        return;
    }

    var token = localStorage.getItem('authToken');
    var headers = { 'x-auth-token': token, 'Content-Type': 'application/json' };

    var chatContainer = document.getElementById('chat-container');
    var chatStatus = document.getElementById('chat-status');
    var messageInput = document.getElementById('message-input');
    var sendBtn = document.getElementById('send-btn');
    var charCount = document.getElementById('char-count');

    var chatId = null;
    var isSending = false;
    var lastMessageCount = 0;
    var pollInterval = null;
    var MAX_MSG_LENGTH = 2000;

    function handleAuthError(status) {
        if (status === 401) {
            localStorage.removeItem('authToken');
            window.location.href = '/login.html';
            return true;
        }
        return false;
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function renderMessage(message, animate) {
        var isUser = message.sender === 'user';

        var messageEl = document.createElement('div');
        messageEl.className = 'message ' + (isUser ? 'user-message' : 'admin-message');
        if (animate === false) messageEl.style.animation = 'none';

        if (!isUser) {
            var senderDiv = document.createElement('div');
            senderDiv.className = 'msg-sender';
            senderDiv.textContent = 'Support Team';
            messageEl.appendChild(senderDiv);
        }

        var contentP = document.createElement('p');
        contentP.className = 'msg-content';
        contentP.textContent = message.content || '';
        messageEl.appendChild(contentP);

        var timeSpan = document.createElement('span');
        timeSpan.className = 'msg-time';
        timeSpan.textContent = message.timestamp
            ? new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            : '';
        messageEl.appendChild(timeSpan);

        chatContainer.appendChild(messageEl);
        return messageEl;
    }

    function renderDateSeparator(dateStr) {
        var sep = document.createElement('div');
        sep.className = 'date-sep';
        var span = document.createElement('span');
        span.textContent = dateStr;
        sep.appendChild(span);
        chatContainer.appendChild(sep);
    }

    function showWelcome() {
        var welcome = document.createElement('div');
        welcome.className = 'welcome-msg';
        welcome.innerHTML =
            '<div class="welcome-msg-icon"><svg width="24" height="24" fill="none" stroke="var(--gold)" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>' +
            '<p><strong>Welcome to Support!</strong></p>' +
            '<p>Send us a message and we\'ll get back to you as soon as possible.</p>';
        chatContainer.appendChild(welcome);
    }

    function renderAllMessages(messages) {
        chatContainer.innerHTML = '';

        if (!messages || messages.length === 0) {
            showWelcome();
            return;
        }

        var lastDate = '';
        for (var i = 0; i < messages.length; i++) {
            var msg = messages[i];
            var msgDate = msg.timestamp
                ? new Date(msg.timestamp).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' })
                : '';

            if (msgDate && msgDate !== lastDate) {
                renderDateSeparator(msgDate);
                lastDate = msgDate;
            }

            renderMessage(msg, false);
        }

        scrollToBottom();
    }

    function initializeChat() {
        chatStatus.textContent = 'Connecting to support...';
        sendBtn.disabled = true;

        fetch('/api/user/support/initialize-chat', { headers: headers })
            .then(function (res) {
                if (handleAuthError(res.status)) return null;
                return res.json();
            })
            .then(function (data) {
                if (!data) return;

                if (data.success && data.chatId) {
                    chatId = data.chatId;
                    chatStatus.style.display = 'none';

                    var messages = data.messages || [];
                    lastMessageCount = messages.length;
                    renderAllMessages(messages);

                    sendBtn.disabled = false;
                    startPolling();
                } else {
                    chatStatus.textContent = data.message || 'Could not initialize chat.';
                }
            })
            .catch(function (error) {
                console.error('Chat init error:', error);
                chatStatus.textContent = 'Connection error. Please try again.';
            });
    }

    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);

        pollInterval = setInterval(function () {
            if (!chatId) return;

            fetch('/api/user/support/initialize-chat', { headers: headers })
                .then(function (res) {
                    if (handleAuthError(res.status)) return null;
                    return res.json();
                })
                .then(function (data) {
                    if (!data || !data.success) return;

                    var messages = data.messages || [];
                    if (messages.length > lastMessageCount) {
                        lastMessageCount = messages.length;

                        var isNearBottom =
                            chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 100;

                        renderAllMessages(messages);

                        if (isNearBottom) scrollToBottom();
                    }
                })
                .catch(function () {});
        }, 10000);
    }

    window.addEventListener('beforeunload', function () {
        if (pollInterval) clearInterval(pollInterval);
    });

    function sendMessage() {
        var content = messageInput.value.trim();
        if (!content || !chatId || isSending) return;

        if (content.length > MAX_MSG_LENGTH) {
            alert('Message too long. Maximum ' + MAX_MSG_LENGTH + ' characters.');
            return;
        }

        isSending = true;
        messageInput.value = '';
        sendBtn.disabled = true;
        charCount.style.display = 'none';

        var welcome = chatContainer.querySelector('.welcome-msg');
        if (welcome) welcome.remove();

        var tempMessage = { content: content, sender: 'user', timestamp: new Date() };
        var tempEl = renderMessage(tempMessage, true);
        tempEl.dataset.temp = 'true';
        scrollToBottom();
        lastMessageCount++;

        fetch('/api/user/support/send-message', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ chatId: chatId, content: content }),
        })
            .then(function (res) {
                if (handleAuthError(res.status)) return null;
                return res.json();
            })
            .then(function (data) {
                if (!data) return;
                if (data.success) {
                    tempEl.removeAttribute('data-temp');
                } else {
                    markFailed(tempEl, content);
                }
            })
            .catch(function () {
                markFailed(tempEl, content);
            })
            .finally(function () {
                isSending = false;
                sendBtn.disabled = false;
                messageInput.focus();
            });
    }

    function markFailed(el, content) {
        el.classList.add('msg-failed');
        var retrySpan = document.createElement('span');
        retrySpan.className = 'msg-retry';
        retrySpan.textContent = 'Failed to send. Tap to retry.';
        retrySpan.addEventListener('click', function () {
            el.remove();
            lastMessageCount--;
            messageInput.value = content;
            sendMessage();
        });
        el.appendChild(retrySpan);
    }

    messageInput.addEventListener('input', function () {
        var len = messageInput.value.length;
        if (len > 0) {
            charCount.style.display = 'block';
            charCount.textContent = len + ' / ' + MAX_MSG_LENGTH;
            charCount.className = len > MAX_MSG_LENGTH - 100 ? 'char-count warn' : 'char-count';
        } else {
            charCount.style.display = 'none';
        }
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });

    initializeChat();
});
</script>
</body>
</html>
