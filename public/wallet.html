<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wallet - Bond 1x</title>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" as="style">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--cream:#FBF8F3;--cream-dark:#F2EDE4;--cream-border:#E8DFD0;--brown-dark:#2D1F0E;--brown-mid:#4A3020;--brown-light:#8B6040;--gold:#C9832A;--gold-light:#E8A84A;--gold-pale:#F5E8D0;--green:#3D7A52;--red:#C0392B;--text-main:#1E140A;--text-muted:#9A8070;--white:#FFFFFF;}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-main);min-height:100vh;padding-bottom:90px;overflow-x:hidden;}

        /* Header */
        .hdr{background:var(--brown-dark);padding:20px 20px 0;position:relative;overflow:hidden;}
        .hdr::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,131,42,.15),transparent 70%);}
        .hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
        .hdr-logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--gold);letter-spacing:3px;}
        .hero{background:var(--brown-mid);border-radius:18px 18px 0 0;padding:20px;border:1px solid rgba(201,131,42,.15);border-bottom:none;position:relative;overflow:hidden;}
        .hero::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
        .hero-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-style:italic;color:var(--gold-light);margin-bottom:4px;}
        .hero-sub{font-size:13px;color:#D4B896;}

        /* Body */
        .bdy{padding:16px;}

        /* Tabs */
        .tabs{display:flex;background:var(--white);border:1px solid var(--cream-border);border-radius:14px;padding:4px;margin-bottom:16px;box-shadow:0 2px 8px rgba(45,31,14,.04);}
        .tab-btn{flex:1;padding:12px 0;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--text-muted);background:transparent;border:none;cursor:pointer;border-radius:10px;transition:all .2s;letter-spacing:1px;text-transform:uppercase;}
        .tab-btn.active{background:var(--gold);color:var(--brown-dark);}
        .tab-btn:active{transform:scale(.97);}

        .tab-content{display:none;}
        .tab-content.active{display:block;}

        /* Cards */
        .w-card{background:var(--white);border:1px solid var(--cream-border);border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(45,31,14,.06);margin-bottom:16px;animation:fu .4s ease both;}
        @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

        .sec-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;}

        /* Balance box */
        .bal-box{display:flex;justify-content:space-between;align-items:center;background:var(--cream-dark);border:1px solid var(--cream-border);border-radius:14px;padding:16px;margin-bottom:16px;}
        .bal-box-lbl{font-size:12px;color:var(--text-muted);}
        .bal-box-val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--green);}

        /* Form */
        .form-group{margin-bottom:14px;}
        .form-label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
        .form-input{width:100%;background:var(--cream-dark);border:1px solid var(--cream-border);border-radius:12px;padding:14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text-main);outline:none;transition:border-color .2s;}
        .form-input:focus{border-color:var(--gold);}
        .form-input::placeholder{color:var(--text-muted);}
        select.form-input{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%239A8070' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;}

        /* Buttons */
        .btn-primary{width:100%;border:none;border-radius:12px;padding:14px;font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:1px;font-weight:600;cursor:pointer;transition:all .2s;background:var(--gold);color:var(--brown-dark);box-shadow:0 4px 16px rgba(201,131,42,.3);}
        .btn-primary:active{transform:scale(.97);background:var(--gold-light);}
        .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
        .btn-secondary{width:100%;border:none;border-radius:12px;padding:12px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--text-muted);transition:color .2s;}
        .btn-secondary:active{color:var(--text-main);}
        .btn-green{width:100%;border:none;border-radius:12px;padding:14px;font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:1px;font-weight:600;cursor:pointer;transition:all .2s;background:var(--green);color:var(--white);box-shadow:0 4px 16px rgba(61,122,82,.2);}
        .btn-green:active{transform:scale(.97);}
        .btn-green:disabled{opacity:.6;cursor:not-allowed;transform:none;}

        /* QR Section */
        .qr-wrap{text-align:center;margin-bottom:16px;}
        .qr-wrap img{width:128px;height:128px;border-radius:12px;border:3px solid var(--cream-border);padding:6px;background:var(--white);}
        .qr-wrap p{font-size:11px;color:var(--text-muted);margin-top:6px;}

        /* Invoice details */
        .inv-box{background:var(--cream-dark);border:1px solid var(--cream-border);border-radius:14px;padding:16px;}
        .inv-row{margin-bottom:12px;}
        .inv-row:last-child{margin-bottom:0;}
        .inv-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px;}
        .inv-val{font-size:14px;font-weight:500;color:var(--text-main);}
        .inv-val.amount{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--green);}
        .inv-val.currency{font-size:12px;color:var(--text-muted);text-transform:uppercase;}

        .addr-box{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--cream-border);border-radius:10px;padding:10px;}
        .addr-text{flex:1;font-size:11px;color:var(--brown-light);word-break:break-all;font-family:monospace;}
        .btn-copy{background:var(--gold-pale);border:1px solid var(--cream-border);border-radius:8px;padding:6px 12px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:var(--gold);cursor:pointer;transition:all .2s;white-space:nowrap;}
        .btn-copy:active{background:var(--gold);color:var(--brown-dark);}

        /* Warning box */
        .warn-box{background:var(--gold-pale);border:1px solid rgba(201,131,42,.3);border-radius:12px;padding:12px;margin-top:14px;}
        .warn-box p{font-size:11px;color:var(--brown-light);text-align:center;line-height:1.5;}

        /* History items */
        .hist-item{display:flex;justify-content:space-between;align-items:center;background:var(--cream-dark);border:1px solid var(--cream-border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
        .hist-item:last-child{margin-bottom:0;}
        .hist-left{}
        .hist-amt{font-size:14px;font-weight:500;color:var(--text-main);}
        .hist-date{font-size:11px;color:var(--text-muted);margin-top:2px;}
        .hist-badge{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:20px;}
        .badge-completed{background:rgba(61,122,82,.12);border:1px solid rgba(61,122,82,.3);color:var(--green);}
        .badge-pending{background:var(--gold-pale);border:1px solid rgba(201,131,42,.3);color:var(--gold);}
        .badge-failed,.badge-rejected{background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.3);color:var(--red);}

        /* Status & Error messages */
        .msg{text-align:center;font-size:12px;margin-top:10px;min-height:18px;}
        .msg-success{color:var(--green);}
        .msg-error{color:var(--red);}
        .msg-warn{color:var(--gold);}
        .msg-empty{color:var(--text-muted);font-size:12px;text-align:center;padding:12px 0;}

        .hidden{display:none!important;}

        /* History scroll */
        .hist-scroll{max-height:240px;overflow-y:auto;}

        /* Divider */
        .divider{border:none;border-top:1px solid var(--cream-border);margin:20px 0 16px;}

        /* Skeleton */
        .skel{background:linear-gradient(90deg,var(--cream-dark) 25%,var(--cream-border) 50%,var(--cream-dark) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:6px;display:block;}
        @keyframes sh{to{background-position:-200% 0}}

        /* Nav */
        .nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;background:var(--brown-dark);border-radius:22px;padding:12px 8px;display:flex;justify-content:space-around;z-index:1000;box-shadow:0 8px 32px rgba(45,31,14,.25);border:1px solid rgba(201,131,42,.15);}
        .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;transition:all .2s;}
        .ni svg{color:#9A8060;transition:color .2s;}
        .ni span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#9A8060;transition:color .2s;font-weight:500;}
        .ni.active svg,.ni.active span{color:var(--gold);}
        .nd{width:3px;height:3px;border-radius:50%;background:var(--gold);margin-top:1px;display:none;}
        .ni.active .nd{display:block;}
    </style>
</head>
<body>
<script>
    if (!localStorage.getItem('authToken')) window.location.href = '/login.html';
</script>

<div class="hdr">
    <div class="hdr-top">
        <div class="hdr-logo">Bond 1x</div>
    </div>
    <div class="hero">
        <div class="hero-title">My Wallet</div>
        <div class="hero-sub">Secure deposit &amp; withdrawal</div>
    </div>
</div>

<div class="bdy">
    <!-- Tabs -->
    <div class="tabs">
        <button id="deposit-tab-btn" class="tab-btn active">Deposit</button>
        <button id="withdraw-tab-btn" class="tab-btn">Withdraw</button>
    </div>

    <!-- ===== DEPOSIT TAB ===== -->
    <div id="deposit-content" class="tab-content active">
        <div class="w-card">
            <!-- Phase 1: Create Deposit -->
            <div id="deposit-phase-1">
                <div class="sec-lbl">Create New Deposit</div>
                <form id="deposit-create-form">
                    <div class="form-group">
                        <label class="form-label">Amount (USD)</label>
                        <input type="number" id="deposit-amount" class="form-input" placeholder="e.g. 100" required min="5">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Select Currency</label>
                        <select id="deposit-currency" class="form-input">
                            <option value="usdtbsc" selected>USDT (BEP20/BSC) - Recommended</option>
                            <option value="ltc">Litecoin (LTC) - Low Fees</option>
                            <option value="maticmainnet">Polygon (MATIC) - Low Fees</option>
                            <option value="algo">Algorand (ALGO) - Low Fees</option>
                            <option value="usdttrc20">USDT (TRC20) - High Fees</option>
                        </select>
                    </div>
                    <button type="submit" id="btn-create-deposit" class="btn-primary">Generate Deposit Address</button>
                </form>
                <p id="create-error" class="msg msg-error hidden"></p>
            </div>

            <!-- Phase 2: Invoice -->
            <div id="deposit-phase-2" class="hidden">
                <div class="qr-wrap">
                    <img id="qr-code-img" src="" alt="QR Code">
                    <p>Scan to pay</p>
                </div>

                <div class="inv-box">
                    <div class="inv-row">
                        <div class="inv-lbl">Send Exactly</div>
                        <div class="inv-val amount"><span id="invoice-amount">0.0000</span> <span id="invoice-currency" class="currency"></span></div>
                    </div>
                    <div class="inv-row">
                        <div class="inv-lbl">To Address</div>
                        <div class="addr-box">
                            <code id="invoice-address" class="addr-text"></code>
                            <button type="button" id="btn-copy" class="btn-copy">Copy</button>
                        </div>
                    </div>
                    <div class="inv-row">
                        <div class="inv-lbl">Payment ID</div>
                        <div class="inv-val" id="invoice-id" style="font-size:11px;color:var(--text-muted);font-family:monospace;">...</div>
                    </div>
                </div>

                <div class="warn-box">
                    <p>⚠️ Send the <strong>exact amount</strong> shown above. Wait for the network to confirm.</p>
                </div>

                <div style="margin-top:16px;">
                    <button type="button" id="btn-check-status" class="btn-green">I Have Paid / Check Status</button>
                    <button type="button" id="btn-cancel-deposit" class="btn-secondary" style="margin-top:8px;">Cancel / New Deposit</button>
                </div>

                <p id="status-result" class="msg" style="margin-top:10px;"></p>
            </div>
        </div>

        <!-- Deposit History -->
        <div class="w-card" style="animation-delay:.1s;">
            <div class="sec-lbl">Recent Deposits</div>
            <div id="deposit-history-list" class="hist-scroll">
                <div style="display:flex;flex-direction:column;gap:8px;">
                    <span class="skel" style="width:100%;height:48px;border-radius:12px;"></span>
                    <span class="skel" style="width:100%;height:48px;border-radius:12px;"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== WITHDRAW TAB ===== -->
    <div id="withdraw-content" class="tab-content">
        <div class="w-card">
            <div class="bal-box">
                <span class="bal-box-lbl">Available Balance</span>
                <span class="bal-box-val" id="withdraw-balance"><span class="skel" style="width:80px;height:26px;border-radius:4px;"></span></span>
            </div>

            <form id="withdraw-form">
                <div class="form-group">
                    <label class="form-label">Withdraw Amount ($)</label>
                    <input type="number" id="withdraw-amount" class="form-input" placeholder="Min $10" required min="10">
                </div>
                <div class="form-group">
                    <label class="form-label">Your Wallet Address (TRC20)</label>
                    <input type="text" id="withdraw-address" class="form-input" placeholder="T..." required>
                </div>
                <button type="submit" id="btn-withdraw" class="btn-primary">Request Withdrawal</button>
            </form>
            <p id="withdraw-msg" class="msg"></p>
        </div>

        <!-- Withdraw History -->
        <div class="w-card" style="animation-delay:.1s;">
            <div class="sec-lbl">Withdrawal History</div>
            <div id="withdraw-history-list" class="hist-scroll">
                <div style="display:flex;flex-direction:column;gap:8px;">
                    <span class="skel" style="width:100%;height:48px;border-radius:12px;"></span>
                    <span class="skel" style="width:100%;height:48px;border-radius:12px;"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<nav class="nav">
    <a href="dashboard.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg><span>Home</span><div class="nd"></div></a>
    <a href="packages.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>Packages</span><div class="nd"></div></a>
    <a href="earning.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg><span>Earn</span><div class="nd"></div></a>
    <a href="wallet.html" class="ni active"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2z"/></svg><span>Wallet</span><div class="nd"></div></a>
    <a href="profile.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0114 0"/></svg><span>Profile</span><div class="nd"></div></a>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var token = localStorage.getItem('authToken');
    var headers = {'Content-Type':'application/json','x-auth-token':token};

    // --- TABS ---
    var depositTab = document.getElementById('deposit-tab-btn');
    var withdrawTab = document.getElementById('withdraw-tab-btn');
    var depositContent = document.getElementById('deposit-content');
    var withdrawContent = document.getElementById('withdraw-content');

    function switchTab(mode) {
        if(mode === 'deposit'){
            depositTab.classList.add('active');
            withdrawTab.classList.remove('active');
            depositContent.classList.add('active');
            withdrawContent.classList.remove('active');
        } else {
            withdrawTab.classList.add('active');
            depositTab.classList.remove('active');
            withdrawContent.classList.add('active');
            depositContent.classList.remove('active');
        }
    }
    depositTab.addEventListener('click', function(){switchTab('deposit');});
    withdrawTab.addEventListener('click', function(){switchTab('withdraw');});

    // --- DEPOSIT ---
    var phase1 = document.getElementById('deposit-phase-1');
    var phase2 = document.getElementById('deposit-phase-2');
    var createForm = document.getElementById('deposit-create-form');
    var createBtn = document.getElementById('btn-create-deposit');
    var createError = document.getElementById('create-error');
    var currentPaymentId = null;

    createForm.addEventListener('submit', function(e) {
        e.preventDefault();
        createBtn.disabled = true;
        createBtn.innerText = 'Generating Invoice...';
        createError.classList.add('hidden');

        var amount = document.getElementById('deposit-amount').value;
        var currency = document.getElementById('deposit-currency').value;

        fetch('/api/deposit/create_deposit',{
            method:'POST', headers:headers,
            body:JSON.stringify({amount:amount, currency:currency})
        })
        .then(function(r){return r.json();})
        .then(function(data){
            if(!data.success) throw new Error(data.message);

            currentPaymentId = data.payment_id;
            document.getElementById('invoice-amount').innerText = data.amount_expected;
            document.getElementById('invoice-currency').innerText = currency;
            document.getElementById('invoice-address').innerText = data.deposit_address;
            document.getElementById('invoice-id').innerText = data.payment_id;

            var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + data.deposit_address;
            document.getElementById('qr-code-img').src = qrUrl;

            phase1.classList.add('hidden');
            phase2.classList.remove('hidden');
        })
        .catch(function(err){
            createError.innerText = err.message;
            createError.classList.remove('hidden');
        })
        .finally(function(){
            createBtn.disabled = false;
            createBtn.innerText = 'Generate Deposit Address';
        });
    });

    // COPY
    document.getElementById('btn-copy').addEventListener('click', function(){
        var addr = document.getElementById('invoice-address').innerText;
        navigator.clipboard.writeText(addr);
        var btn = document.getElementById('btn-copy');
        btn.innerText = 'Copied!';
        setTimeout(function(){btn.innerText = 'Copy';}, 2000);
    });

    // CHECK STATUS
    var statusBtn = document.getElementById('btn-check-status');
    var statusMsg = document.getElementById('status-result');

    statusBtn.addEventListener('click', function(){
        if(!currentPaymentId) return;
        statusBtn.disabled = true;
        statusBtn.innerText = 'Checking Blockchain...';
        statusMsg.innerText = '';

        fetch('/api/deposit/verify',{
            method:'POST', headers:headers,
            body:JSON.stringify({payment_id:currentPaymentId})
        })
        .then(function(r){return r.json();})
        .then(function(data){
            if(data.status === 'completed' || data.status === 'finished'){
                statusMsg.className = 'msg msg-success';
                statusMsg.innerText = '✅ Payment Received! Balance Updated.';
                setTimeout(function(){location.reload();}, 2000);
            } else {
                statusMsg.className = 'msg msg-warn';
                statusMsg.innerText = 'Status: ' + data.status + '. Please wait & try again.';
            }
        })
        .catch(function(){
            statusMsg.className = 'msg msg-error';
            statusMsg.innerText = 'Error checking status.';
        })
        .finally(function(){
            statusBtn.disabled = false;
            statusBtn.innerText = 'I Have Paid / Check Status';
        });
    });

    // CANCEL
    document.getElementById('btn-cancel-deposit').addEventListener('click', function(){
        phase2.classList.add('hidden');
        phase1.classList.remove('hidden');
        createForm.reset();
        statusMsg.innerText = '';
    });

    // DEPOSIT HISTORY
    function loadDepositHistory() {
        var list = document.getElementById('deposit-history-list');
        fetch('/api/deposit/history',{headers:headers})
        .then(function(r){return r.json();})
        .then(function(data){
            if(data.history && data.history.length > 0){
                var html = '';
                for(var i=0; i<data.history.length; i++){
                    var tx = data.history[i];
                    var badgeClass = tx.status === 'completed' ? 'badge-completed' : (tx.status === 'failed' ? 'badge-failed' : 'badge-pending');
                    var statusText = tx.status ? tx.status.toUpperCase() : 'PENDING';
                    html += '<div class="hist-item"><div class="hist-left"><div class="hist-amt">' + tx.amount + ' <span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">' + (tx.currency || 'USD') + '</span></div><div class="hist-date">' + new Date(tx.date).toLocaleDateString() + '</div></div><span class="hist-badge ' + badgeClass + '">' + statusText + '</span></div>';
                }
                list.innerHTML = html;
            } else {
                list.innerHTML = '<p class="msg-empty">No deposits yet.</p>';
            }
        })
        .catch(function(){
            list.innerHTML = '<p class="msg msg-error">Failed to load history</p>';
        });
    }

    // --- WITHDRAW ---
    function loadUserBalance() {
        fetch('/api/user/info',{headers:headers})
        .then(function(r){return r.json();})
        .then(function(data){
            if(data.success){
                document.getElementById('withdraw-balance').innerText = '$' + data.user.balance.toFixed(2);
            }
        })
        .catch(function(){});
    }

    function loadWithdrawHistory() {
        var list = document.getElementById('withdraw-history-list');
        fetch('/api/withdraw/history',{headers:headers})
        .then(function(r){return r.json();})
        .then(function(data){
            if(data.history && data.history.length > 0){
                var html = '';
                for(var i=0; i<data.history.length; i++){
                    var tx = data.history[i];
                    var badgeClass = tx.status === 'completed' ? 'badge-completed' : (tx.status === 'rejected' ? 'badge-rejected' : 'badge-pending');
                    var statusText = tx.status ? tx.status.toUpperCase() : 'PENDING';
                    html += '<div class="hist-item"><div class="hist-left"><div class="hist-amt">$' + tx.amount.toFixed(2) + '</div><div class="hist-date">' + new Date(tx.date).toLocaleDateString() + '</div></div><span class="hist-badge ' + badgeClass + '">' + statusText + '</span></div>';
                }
                list.innerHTML = html;
            } else {
                list.innerHTML = '<p class="msg-empty">No withdrawals yet.</p>';
            }
        })
        .catch(function(){});
    }

    var withdrawForm = document.getElementById('withdraw-form');
    var withdrawBtn = document.getElementById('btn-withdraw');
    var withdrawMsg = document.getElementById('withdraw-msg');

    withdrawForm.addEventListener('submit', function(e){
        e.preventDefault();
        withdrawBtn.disabled = true;
        withdrawBtn.innerText = 'Processing...';
        withdrawMsg.innerText = '';

        var amount = document.getElementById('withdraw-amount').value;
        var address = document.getElementById('withdraw-address').value;

        fetch('/api/withdraw/request',{
            method:'POST', headers:headers,
            body:JSON.stringify({amount:amount, address:address})
        })
        .then(function(r){return r.json();})
        .then(function(data){
            if(!data.success) throw new Error(data.message);
            withdrawMsg.className = 'msg msg-success';
            withdrawMsg.innerText = data.message;
            withdrawForm.reset();
            loadUserBalance();
            loadWithdrawHistory();
        })
        .catch(function(err){
            withdrawMsg.className = 'msg msg-error';
            withdrawMsg.innerText = err.message;
        })
        .finally(function(){
            withdrawBtn.disabled = false;
            withdrawBtn.innerText = 'Request Withdrawal';
        });
    });

    // INIT
    loadDepositHistory();
    loadUserBalance();
    loadWithdrawHistory();
});
</script>
</body>
</html>
