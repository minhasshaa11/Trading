<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Daily Earning - Bond 1x</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--cream:#FBF8F3;--cream-dark:#F2EDE4;--cream-border:#E8DFD0;--brown-dark:#2D1F0E;--brown-mid:#4A3020;--brown-light:#8B6040;--gold:#C9832A;--gold-light:#E8A84A;--gold-pale:#F5E8D0;--green:#3D7A52;--text-main:#1E140A;--text-muted:#9A8070;--white:#FFFFFF;}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-main);min-height:100vh;padding-bottom:90px;overflow-x:hidden;display:flex;flex-direction:column;}

        /* Header */
        .hdr{background:var(--brown-dark);padding:20px 20px 0;position:relative;overflow:hidden;}
        .hdr::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,131,42,.15),transparent 70%);}
        .hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
        .hdr-logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--gold);letter-spacing:3px;}
        .hero{background:var(--brown-mid);border-radius:18px 18px 0 0;padding:20px;border:1px solid rgba(201,131,42,.15);border-bottom:none;position:relative;overflow:hidden;}
        .hero::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
        .hero-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-style:italic;color:var(--gold-light);margin-bottom:4px;}
        .hero-sub{font-size:13px;color:#D4B896;}

        /* Body */
        .bdy{padding:16px;flex:1;display:flex;align-items:center;justify-content:center;}

        /* Earning Card */
        .earn-card{background:var(--white);border:1px solid var(--cream-border);border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 4px 24px rgba(45,31,14,.08);width:100%;max-width:420px;animation:fu .4s ease both;}
        @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

        .earn-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-style:italic;color:var(--text-main);margin-bottom:8px;}
        .earn-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.5;}
        .earn-profit{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--gold);}

        /* Countdown */
        .countdown{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600;color:var(--gold);letter-spacing:2px;margin-top:8px;}

        /* Claim Button */
        .claim-btn{width:100%;border:none;border-radius:14px;padding:16px;font-family:'DM Sans',sans-serif;font-size:14px;letter-spacing:1px;font-weight:600;cursor:pointer;transition:all .2s;background:var(--gold);color:var(--brown-dark);box-shadow:0 4px 16px rgba(201,131,42,.3);}
        .claim-btn:active{transform:scale(.97);background:var(--gold-light);}
        .claim-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

        /* Status */
        .status-msg{font-size:12px;margin-top:14px;min-height:20px;}
        .status-msg.error{color:#C0392B;}
        .status-msg.success{color:var(--green);}

        /* Upgrade hint */
        .upgrade-hint{margin-top:20px;padding-top:16px;border-top:1px solid var(--cream-border);}
        .upgrade-hint p{font-size:12px;color:var(--text-muted);margin-bottom:4px;}
        .upgrade-hint a{font-size:12px;font-weight:600;color:var(--gold);text-decoration:none;}

        /* Error card */
        .earn-err-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:#C0392B;margin-bottom:8px;}
        .earn-err-msg{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.5;}
        .earn-err-link{font-size:13px;font-weight:600;color:var(--gold);text-decoration:none;background:var(--gold-pale);padding:10px 24px;border-radius:12px;display:inline-block;}

        /* Loading */
        .loading-text{font-size:13px;color:var(--text-muted);}

        /* No package icon */
        .earn-icon{width:64px;height:64px;border-radius:18px;background:var(--gold-pale);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;}

        /* Nav */
        .nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;background:var(--brown-dark);border-radius:22px;padding:12px 8px;display:flex;justify-content:space-around;z-index:1000;box-shadow:0 8px 32px rgba(45,31,14,.25);border:1px solid rgba(201,131,42,.15);}
        .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;transition:all .2s;}
        .ni svg{color:#9A8060;transition:color .2s;}
        .ni span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#9A8060;transition:color .2s;font-weight:500;}
        .ni.active svg,.ni.active span{color:var(--gold);}
        .nd{width:3px;height:3px;border-radius:50%;background:var(--gold);margin-top:1px;display:none;}
        .ni.active .nd{display:block;}
    </style>
</head>
<body>
<script>
    var token = localStorage.getItem('authToken');
    if (!token) window.location.href = '/login.html';
</script>

<div class="hdr">
    <div class="hdr-top">
        <div class="hdr-logo">Bond 1x</div>
    </div>
    <div class="hero">
        <div class="hero-title">Daily Earnings</div>
        <div class="hero-sub">Claim your daily profit here</div>
    </div>
</div>

<div class="bdy">
    <div class="earn-card" id="earning-card">
        <p class="loading-text">Loading your earning status...</p>
    </div>
</div>

<nav class="nav">
    <a href="dashboard.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg><span>Home</span><div class="nd"></div></a>
    <a href="packages.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>Packages</span><div class="nd"></div></a>
    <a href="earning.html" class="ni active"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg><span>Earn</span><div class="nd"></div></a>
    <a href="wallet.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2z"/></svg><span>Wallet</span><div class="nd"></div></a>
    <a href="profile.html" class="ni"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0114 0"/></svg><span>Profile</span><div class="nd"></div></a>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var token = localStorage.getItem('authToken');
    var headers = {'Content-Type':'application/json','x-auth-token':token};
    var earningCard = document.getElementById('earning-card');
    var countdownInterval;

    var profitMap = {"Bronze":1,"Silver":4,"Gold":9,"Platinum":23,"Diamond":50};
    var packageOrder = ["Bronze","Silver","Gold","Platinum","Diamond"];

    function showReadyToClaim(profitAmount, upgradeMessage) {
        earningCard.innerHTML =
            '<div class="earn-icon"><svg width="28" height="28" fill="none" stroke="' + 'var(--gold)' + '" stroke-width="1.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>' +
            '<div class="earn-title">Claim Your Daily Profit</div>' +
            '<p class="earn-sub">Your profit of <span class="earn-profit">$' + profitAmount.toLocaleString() + '</span> is ready.</p>' +
            '<button id="claim-btn" class="claim-btn">Claim Now</button>' +
            '<div id="status-message" class="status-msg"></div>' +
            upgradeMessage;
        document.getElementById('claim-btn').addEventListener('click', handleClaim);
    }

    function showWaiting(nextClaimTime) {
        earningCard.innerHTML =
            '<div class="earn-icon"><svg width="28" height="28" fill="none" stroke="' + 'var(--green)' + '" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>' +
            '<div class="earn-title">Profit Claimed</div>' +
            '<p class="earn-sub">Your next claim will be available in:</p>' +
            '<div id="countdown" class="countdown">--:--:--</div>';
        startCountdown(nextClaimTime);
    }

    function showError(message) {
        earningCard.innerHTML =
            '<div class="earn-icon" style="background:rgba(192,57,43,.1);"><svg width="28" height="28" fill="none" stroke="#C0392B" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>' +
            '<div class="earn-err-title">Unable to Claim</div>' +
            '<p class="earn-err-msg">' + message + '</p>' +
            '<a href="packages.html" class="earn-err-link">View Packages</a>';
    }

    function startCountdown(endTime) {
        if(countdownInterval) clearInterval(countdownInterval);
        var countdownElem = document.getElementById('countdown');
        countdownInterval = setInterval(function(){
            var distance = endTime - new Date().getTime();
            if(distance < 0){clearInterval(countdownInterval);location.reload();return;}
            var hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
            var minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
            var seconds = Math.floor((distance % (1000*60)) / 1000);
            countdownElem.textContent = hours.toString().padStart(2,'0') + ':' + minutes.toString().padStart(2,'0') + ':' + seconds.toString().padStart(2,'0');
        }, 1000);
    }

    function handleClaim() {
        var claimBtn = document.getElementById('claim-btn');
        var statusMessage = document.getElementById('status-message');
        claimBtn.disabled = true;
        claimBtn.textContent = 'Processing...';

        fetch('/api/user/claim-earnings',{method:'POST',headers:headers})
        .then(function(r){return r.json();})
        .then(function(result){
            if(result.success){
                confetti({particleCount:150,spread:90,origin:{y:0.6},colors:['#C9832A','#E8A84A','#3D7A52']});
                setTimeout(fetchUserStatus, 1500);
            } else {
                statusMessage.className = 'status-msg error';
                statusMessage.textContent = result.message;
                claimBtn.disabled = false;
                claimBtn.textContent = 'Claim Now';
            }
        })
        .catch(function(){
            statusMessage.className = 'status-msg error';
            statusMessage.textContent = 'An error occurred.';
            claimBtn.disabled = false;
            claimBtn.textContent = 'Claim Now';
        });
    }

    function fetchUserStatus() {
        fetch('/api/user/info',{headers:headers})
        .then(function(r){return r.json();})
        .then(function(result){
            if(!result.success) return showError("Could not verify your account status.");
            var user = result.user;
            if(!user.active_package) return showError("You do not have an active investment package.");
            if(new Date() > new Date(user.package_expiry_date)) return showError("Your investment package has expired.");

            var todayReset = new Date();
            todayReset.setUTCHours(0,0,0,0);

            if(user.last_claim_timestamp && new Date(user.last_claim_timestamp) > todayReset){
                var tomorrowReset = new Date(todayReset.getTime() + 24*60*60*1000);
                showWaiting(tomorrowReset.getTime());
            } else {
                var currentPackageIndex = packageOrder.indexOf(user.active_package);
                var upgradeMsg = '';
                if(currentPackageIndex < packageOrder.length - 1){
                    var nextPackage = packageOrder[currentPackageIndex + 1];
                    var nextProfit = profitMap[nextPackage];
                    upgradeMsg = '<div class="upgrade-hint"><p>' + nextPackage + ' members are claiming <strong style="color:var(--gold);">$' + nextProfit.toLocaleString() + '</strong> today.</p><a href="packages.html">Upgrade Plan &rarr;</a></div>';
                }
                showReadyToClaim(profitMap[user.active_package] || 0, upgradeMsg);
            }
        })
        .catch(function(){
            showError("Could not connect to the server.");
        });
    }

    fetchUserStatus();
});
</script>
</body>
</html>
